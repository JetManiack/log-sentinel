state: "data/sentinel.db"

logs:
  - name: "local"
    url: "http://victorialogs:9428"
    # token: ""  # optional Bearer token

  # Second cluster (read-only ingress):
  # - name: "remote"
  #   url: "https://vlogs.cluster2.example.internal"
  #   token: "sk-..."
  #   ca_file: "/etc/ssl/certs/cluster2-ca.pem"  # optional: private CA for TLS

detector:
  interval: 1m
  window_before: 30m
  window_after: 15m
  quiet_window_default: 24h

  # rules_dir loads all *.yaml files from a directory (optional).
  rules_dir: "rules.d"

  # Fail-open patterns are scanned on every poll independently of rules.
  # They are intentionally empty by default: security-only deployment should
  # not fire on reliability/availability patterns. Uncomment and configure
  # only if you want a last-resort backstop for uncovered attack patterns.
  fail_open_patterns: []
  # fail_open_patterns:
  #   - "permission denied"
  #   - "x509"

  # Known-benign suppresses notifications for matched log lines.
  known_benign:
    - pattern: "kubelet readiness probe"
      reason: "routine k8s liveness probe traffic"
    - pattern: "transaction-end-before-headers"
      reason: "squid TCP probe artefact, not a real request"

llm:
  enabled: false
  # base_url: "http://llm-gateway/v1"
  # api_key: ""
  # model: "gemma-4-26b-a4b-it"
  max_tokens_step: 256
  max_tokens_final: 1200
  step_timeout: 60s
  total_timeout: 240s
  # Context window fetched around each matched event for LLM enrichment.
  context_window: 2m
  context_lines: 20
  # Override directory for prompt YAML blueprints (optional).
  # Files here replace built-in prompts by their `name` field.
  # prompts_dir: "prompts.d"

sinks:
  stdout_json: true  # always-on; vlagent picks up these lines

  board:
    enabled: false
    # url: "https://board.example.com/mcp"
    # token: ""
    min_severity: "medium"

  webhook:
    enabled: false
    # url: "https://hooks.example.com/sentinel"
    # token: ""

digest:
  time: "19:00"
  timezone: "Asia/Nicosia"  # IANA timezone; digest skipped if no findings in past 24 h

commands:
  # Board actor nicknames allowed to issue /quiet /benign /unquiet.
  allowed_actors: []
  # Subset of allowed_actors that may quiet critical findings.
  critical_mute_actors: []
  # Maximum quiet window an agent (non-critical-mute actor) can set (days).
  max_agent_quiet_days: 7
  # How long an agent /benign entry lasts before operator confirmation (days).
  max_agent_benign_days: 30
