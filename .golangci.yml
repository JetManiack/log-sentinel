version: "2"

linters:
  default: standard

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Conn).Close

    staticcheck:
      checks:
        - all
        - -QF1008

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
